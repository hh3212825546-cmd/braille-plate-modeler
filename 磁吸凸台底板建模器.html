<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁吸凸台底板 · 参数化建模</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#ffffff; --line:#e3e6ee; --ink:#1d2331; --muted:#7a839a;
    --accent:#3b5bdb; --accent2:#0f9d58; --danger:#d64545;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);
    color:var(--ink);font-size:13px;line-height:1.6}
  .app{display:grid;grid-template-columns:356px 1fr;min-height:100vh}
  aside{background:var(--card);border-right:1px solid var(--line);padding:22px 20px 40px;overflow:auto}
  h1{font-size:17px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;margin:0 0 18px}
  section{margin-bottom:16px}
  .lab{display:block;font-size:12px;font-weight:700;color:#414a63;margin-bottom:7px;letter-spacing:.4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
  .field span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
    font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--ink);background:#fbfbfd;
    outline:none;transition:.15s}
  input[type=number]:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px #e8ecfd}
  .actions{display:flex;gap:9px;margin-top:4px}
  button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:9px;padding:9px 14px;cursor:pointer;transition:.15s}
  button:hover{background:#f7f8fc}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;flex:1}
  button.primary:hover{background:#3450c4}
  .meta{margin-top:12px;font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .meta b{color:var(--ink);font-weight:600}
  .warn{color:var(--danger);margin-top:8px;font-size:11.5px}
  .warn div::before{content:"⚠ "}
  main{padding:22px 24px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
    box-shadow:0 1px 2px rgba(20,30,60,.03)}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;font-weight:700;font-size:13px;
    margin-bottom:10px;color:#414a63}
  .tip{font-weight:400;font-size:11px;color:var(--muted)}
  #view{width:100%;height:340px;display:block;border-radius:10px;cursor:grab;touch-action:none;
    background:radial-gradient(120% 90% at 30% 0%,#ffffff 0%,#eff1f7 60%,#e6e9f2 100%)}
  #view:active{cursor:grabbing}
  #plan{width:100%;height:300px;display:block;border-radius:10px;background:#fbfcff}
  .dots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .dot{height:54px;border-radius:10px;border:1px solid var(--line);background:#fbfbfd;color:#a3abc0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;
    font-family:ui-monospace,Consolas,monospace;font-size:11px}
  .dot i{width:15px;height:15px;border-radius:50%;border:1.5px dashed #c3cadb;display:block}
  .dot.on{background:linear-gradient(180deg,#5b78e6,#3350c9);border-color:#3350c9;color:#fff;
    box-shadow:0 3px 9px rgba(51,80,201,.35)}
  .dot.on i{border:none;background:radial-gradient(circle at 32% 28%,#ffffff,#c9d6ff 58%,#9db0f0);
    box-shadow:0 1px 2px rgba(10,20,60,.3)}
  .dotrow{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
  button.mini{padding:4px 10px;font-size:11.5px;border-radius:7px}
  .readout{font-size:11.5px;color:var(--muted);margin-left:auto}
  .readout b{color:var(--ink);font-family:ui-monospace,Consolas,monospace}
  .braille{font-style:normal;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif;
    font-size:18px;line-height:1;color:var(--accent);margin:0 3px 0 1px}
  .check{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:#414a63;cursor:pointer}
  .check input{accent-color:var(--accent)}
  .presets{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;
    padding:8px 9px 10px;background:#fbfbfd}
  .pgname{font-size:10.5px;color:var(--muted);letter-spacing:.6px;margin:7px 0 5px}
  .pgname:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 5px;border-radius:7px;
    border:1px solid var(--line);background:#fff;font-size:11.5px;color:#414a63;
    font-family:ui-monospace,Consolas,monospace;line-height:1.4}
  .chip em{font-style:normal;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif;
    font-size:15px;color:#8b95ad;line-height:1}
  .chip:hover{background:#f5f6fb}
  .chip.on{border-color:var(--accent);background:#eef1fe;color:var(--accent);
    box-shadow:0 0 0 2px #e8ecfd;font-weight:700}
  .chip.on em{color:var(--accent)}
  .hint{font-size:11px;color:var(--muted);margin-top:7px}
  @media (max-width:900px){.app{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>磁吸凸台底板</h1>
    <p class="sub">底部磁铁孔 + 顶部 2×3 圆柱凸台，参数化生成 STL</p>

    <section>
      <div class="lab">本体尺寸（mm）</div>
      <div class="grid2">
        <label class="field"><span>长 X</span><input id="p-L" type="number" step="0.1" min="1" value="24"></label>
        <label class="field"><span>宽 Y</span><input id="p-W" type="number" step="0.1" min="1" value="16"></label>
        <label class="field"><span>高 Z</span><input id="p-H" type="number" step="0.1" min="0.8" value="3.2"></label>
      </div>
    </section>

    <section>
      <div class="lab">底部磁铁孔（居中，垂直底面）</div>
      <div class="grid2">
        <label class="field"><span>孔径 Ø</span><input id="p-holeD" type="number" step="0.05" min="0.5" value="3.1"></label>
        <label class="field"><span>孔深</span><input id="p-holeDepth" type="number" step="0.1" min="0.2" value="2"></label>
      </div>
    </section>

    <section>
      <div class="lab">点位选择（盲文 1–6）</div>
      <div class="dots" id="dots"></div>
      <div class="dotrow">
        <button id="selAll" class="mini">全选</button>
        <button id="selNone" class="mini">清空</button>
        <span class="readout">已选 <b id="dotstr">–</b><em class="braille" id="braille">⠀</em>凸台 <b id="bosscount">0</b></span>
      </div>
      <div class="hint">上排 1·2·3，下排 4·5·6；板面长边方向对应盲文格的上下，识字时把板子竖起来看。</div>
    </section>

    <section>
      <div class="lab">盲文预设（点击套用）</div>
      <div class="presets" id="presets"></div>
      <div class="hint">点击预设即替换当前点位，再点一次则清空；数字盲文需在前一格加数号 ⠼（3456）。</div>
    </section>

    <section>
      <div class="lab">顶部凸台（按所选点位生成）</div>
      <div class="grid2">
        <label class="field"><span>凸台直径 Ø</span><input id="p-bossD" type="number" step="0.1" min="0.4" value="4"></label>
        <label class="field"><span>凸台高度</span><input id="p-bossH" type="number" step="0.1" min="0.2" value="2"></label>
        <label class="field"><span>横向点距</span><input id="p-spacingX" type="number" step="0.1" min="0.4" value="7"></label>
        <label class="field"><span>纵向点距</span><input id="p-spacingY" type="number" step="0.1" min="0.4" value="7"></label>
      </div>
      <label class="check"><input id="p-dome" type="checkbox"> 圆顶凸台（更接近盲文点手感）</label>
    </section>

    <div class="actions">
      <button id="download" class="primary">下载 STL</button>
      <button id="reset">恢复默认</button>
    </div>
    <div id="meta" class="meta"></div>
    <div id="warn" class="warn"></div>
  </aside>

  <main>
    <div class="card">
      <div class="card-h"><span>3D 预览</span><span class="tip">拖动旋转 · 滚轮缩放</span></div>
      <canvas id="view"></canvas>
    </div>
    <div class="card">
      <div class="card-h"><span>俯视 / 底视示意</span><span class="tip">虚线圆 = 底部隐藏孔（透视显示）</span></div>
      <canvas id="plan"></canvas>
    </div>
  </main>
</div>

<script>
/* ========================= CORE_START ========================= */
const SEG_HOLE = 96, SEG_BOSS = 64, EMBED = 0.3;

function pushTri(tris, a, b, c){
  tris.push([a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]]);
}

/* 从中心沿角度 a 的射线与矩形边界的交点 */
function rayBox(a, L, W, cx, cy){
  const dx = Math.cos(a), dy = Math.sin(a);
  let t = Infinity;
  if (dx > 1e-12) t = Math.min(t, (L - cx) / dx);
  else if (dx < -1e-12) t = Math.min(t, (0 - cx) / dx);
  if (dy > 1e-12) t = Math.min(t, (W - cy) / dy);
  else if (dy < -1e-12) t = Math.min(t, (0 - cy) / dy);
  return [cx + t * dx, cy + t * dy];
}

function addCylinder(tris, cx, cy, r, z0, z1, seg){
  const ring = z => {
    const out = [];
    for (let i = 0; i < seg; i++) {
      const a = i / seg * Math.PI * 2;
      out.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]);
    }
    return out;
  };
  const A = ring(z0), B = ring(z1);
  const c0 = [cx, cy, z0], c1 = [cx, cy, z1];
  for (let i = 0; i < seg; i++) {
    const j = (i + 1) % seg;
    // 侧壁（外法向）
    pushTri(tris, A[i], A[j], B[j]);
    pushTri(tris, A[i], B[j], B[i]);
    // 顶盖 +Z
    pushTri(tris, c1, B[i], B[j]);
    // 底盖 -Z
    pushTri(tris, c0, A[j], A[i]);
  }
}

/* 盲文点位 → 板面坐标：板面横向（长边）为盲文列的上下，纵向为左右两列 */
function dotPositions(p){
  const cx = p.L / 2, cy = p.W / 2, out = [];
  for (let d = 1; d <= 6; d++) {
    const row = (d - 1) % 3;                  // 1·2·3 沿长边排，自上而下
    const col = d <= 3 ? 0 : 1;               // 4·5·6 为另一列
    out.push({
      d,
      x: cx + (row - 1) * p.spacingX,
      y: cy + (col === 0 ? p.spacingY / 2 : -p.spacingY / 2)
    });
  }
  return out;
}

const DOT_BIT = { 1: 1, 2: 2, 3: 4, 4: 8, 5: 16, 6: 32 };
function brailleChar(dots){
  let code = 0x2800;
  for (const d of dots) code |= DOT_BIT[d] || 0;
  return String.fromCharCode(code);
}

/* 圆顶凸台：圆柱段 + 椭球顶（总高 = h） */
function addDomeBoss(tris, cx, cy, r, zTop, h, seg){
  const z0 = zTop - EMBED, zb = zTop + h * 0.5;
  const ring = (rad, z) => {
    const out = [];
    for (let i = 0; i < seg; i++) {
      const a = i / seg * Math.PI * 2;
      out.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a), z]);
    }
    return out;
  };
  const A = ring(r, z0), B = ring(r, zb);
  const c0 = [cx, cy, z0];
  for (let i = 0; i < seg; i++) {
    const j = (i + 1) % seg;
    pushTri(tris, c0, A[j], A[i]);              // 底盖
    pushTri(tris, A[i], A[j], B[j]);            // 柱身
    pushTri(tris, A[i], B[j], B[i]);
  }
  const rings = [B], K = 6;
  for (let k = 1; k < K; k++) {
    const a = (k / K) * Math.PI / 2;
    rings.push(ring(r * Math.cos(a), zb + (h * 0.5) * Math.sin(a)));
  }
  for (let k = 0; k < rings.length - 1; k++) {
    const U = rings[k], V = rings[k + 1];
    for (let i = 0; i < seg; i++) {
      const j = (i + 1) % seg;
      pushTri(tris, U[i], U[j], V[j]);
      pushTri(tris, U[i], V[j], V[i]);
    }
  }
  const apex = [cx, cy, zb + h * 0.5], last = rings[rings.length - 1];
  for (let i = 0; i < seg; i++) {
    const j = (i + 1) % seg;
    pushTri(tris, apex, last[i], last[j]);
  }
}

function buildModel(p, sel){
  const L = p.L, W = p.W, H = p.H, cx = L / 2, cy = W / 2;
  const r = p.holeD / 2;
  const depth = Math.min(p.holeDepth, H);
  const through = depth >= H - 1e-6;
  const tris = [], warn = [];

  // —— 角度集合：均布 + 四个角方向（保证外轮廓是精确直角）
  const angles = [];
  for (let i = 0; i < SEG_HOLE; i++) angles.push(i / SEG_HOLE * Math.PI * 2);
  const corners = [[L, W], [0, W], [0, 0], [L, 0]].map(([x, y]) => {
    let a = Math.atan2(y - cy, x - cx);
    if (a < 0) a += Math.PI * 2;
    return { a, pt: [x, y] };
  });
  corners.forEach(c => angles.push(c.a));
  angles.sort((a, b) => a - b);
  const angs = [];
  for (const a of angles) if (!angs.length || a - angs[angs.length - 1] > 1e-9) angs.push(a);

  const B = angs.map(a => {
    const c = corners.find(c => Math.abs(c.a - a) < 1e-9);
    return c ? c.pt.slice() : rayBox(a, L, W, cx, cy);
  });
  const P = angs.map(a => [cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  const M = angs.length;

  // —— 矩形挖圆环形面（up=true 法向 +Z，false 为 -Z）
  const annulus = (z, up) => {
    for (let i = 0; i < M; i++) {
      const j = (i + 1) % M;
      const p0 = [P[i][0], P[i][1], z], p1 = [P[j][0], P[j][1], z];
      const b0 = [B[i][0], B[i][1], z], b1 = [B[j][0], B[j][1], z];
      if (up) { pushTri(tris, p0, b0, b1); pushTri(tris, p0, b1, p1); }
      else    { pushTri(tris, p0, b1, b0); pushTri(tris, p0, p1, b1); }
    }
  };
  // 底面
  annulus(0, false);

  // —— 外壁（法向朝外）
  for (let i = 0; i < M; i++) {
    const j = (i + 1) % M;
    const b0 = [B[i][0], B[i][1], 0], b1 = [B[j][0], B[j][1], 0];
    const t0 = [B[i][0], B[i][1], H], t1 = [B[j][0], B[j][1], H];
    pushTri(tris, b0, b1, t1);
    pushTri(tris, b0, t1, t0);
  }

  // —— 顶面（通孔时为环形，否则整面扇形；边界点共线不影响外形）
  if (through) {
    annulus(H, true);
  } else {
    const topC = [cx, cy, H];
    for (let i = 0; i < M; i++) {
      const j = (i + 1) % M;
      pushTri(tris, topC, [B[i][0], B[i][1], H], [B[j][0], B[j][1], H]);
    }
  }

  // —— 孔壁（法向朝孔内）
  for (let i = 0; i < M; i++) {
    const j = (i + 1) % M;
    const a0 = [P[i][0], P[i][1], 0], a1 = [P[j][0], P[j][1], 0];
    const d0 = [P[i][0], P[i][1], depth], d1 = [P[j][0], P[j][1], depth];
    pushTri(tris, a0, d0, d1);
    pushTri(tris, a0, d1, a1);
  }
  // —— 孔顶（法向 -Z，朝孔内）
  if (!through) {
    const c = [cx, cy, depth];
    for (let i = 0; i < M; i++) {
      const j = (i + 1) % M;
      pushTri(tris, c, [P[j][0], P[j][1], depth], [P[i][0], P[i][1], depth]);
    }
  }

  // —— 顶部凸台：只生成被选中的点位
  const br = p.bossD / 2, bh = p.bossH;
  const pos = dotPositions(p);
  const chosen = pos.filter(o => sel.indexOf(o.d) >= 0);
  for (const o of chosen) {
    if (o.x - br < -1e-6) warn.push('点 ' + o.d + ' 在 X 方向超出板边 ' + (br - o.x).toFixed(2) + ' mm');
    if (o.x + br > L + 1e-6) warn.push('点 ' + o.d + ' 在 X 方向超出板边 ' + (o.x + br - L).toFixed(2) + ' mm');
    if (o.y - br < -1e-6) warn.push('点 ' + o.d + ' 在 Y 方向超出板边 ' + (br - o.y).toFixed(2) + ' mm');
    if (o.y + br > W + 1e-6) warn.push('点 ' + o.d + ' 在 Y 方向超出板边 ' + (o.y + br - W).toFixed(2) + ' mm');
  }
  if (p.spacingX < p.bossD - 1e-6) warn.push('横向点距小于凸台直径，凸台会重叠');
  if (p.spacingY < p.bossD - 1e-6) warn.push('纵向点距小于凸台直径，凸台会重叠');
  if (through && chosen.length) warn.push('孔深 ≥ 板厚：磁铁孔为通孔，正对孔口的凸台底部会悬空');
  if (r * 2 > Math.min(L, W) - 0.4) warn.push('孔径过大，孔壁过薄');

  for (const o of chosen) {
    if (p.dome) addDomeBoss(tris, o.x, o.y, br, H, bh, SEG_BOSS);
    else addCylinder(tris, o.x, o.y, br, H - EMBED, H + bh, SEG_BOSS);
  }

  // 体积（mm³）：凸台与板体重叠部分被重复计入，扣除
  let vol = 0;
  for (const t of tris) {
    vol += (t[0] * (t[4] * t[8] - t[5] * t[7])
          - t[1] * (t[3] * t[8] - t[5] * t[6])
          + t[2] * (t[3] * t[7] - t[4] * t[6])) / 6;
  }
  vol -= chosen.length * Math.PI * br * br * EMBED;
  return {
    tris, L, W, H, totalH: H + bh, pos, chosen, bossD: p.bossD,
    spacingX: p.spacingX, spacingY: p.spacingY, r, depth, vol, warn
  };
}

function buildSTL(tris){
  const n = tris.length;
  const buf = new ArrayBuffer(84 + n * 50);
  const dv = new DataView(buf);
  const head = new TextEncoder().encode('Magnetic braille-style base plate');
  new Uint8Array(buf, 0, head.length).set(head);
  dv.setUint32(80, n, true);
  let o = 84;
  for (const t of tris) {
    const ux = t[3] - t[0], uy = t[4] - t[1], uz = t[5] - t[2];
    const vx = t[6] - t[0], vy = t[7] - t[1], vz = t[8] - t[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    dv.setFloat32(o, nx / len, true); dv.setFloat32(o + 4, ny / len, true); dv.setFloat32(o + 8, nz / len, true);
    o += 12;
    for (let k = 0; k < 9; k++) { dv.setFloat32(o, t[k], true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  return buf;
}
/* ========================= CORE_END ========================= */

/* ---------------------- 界面 ---------------------- */
const $ = id => document.getElementById(id);
const IDS = ['L', 'W', 'H', 'holeD', 'holeDepth', 'bossD', 'bossH', 'spacingX', 'spacingY'];
const DEF = { L: 24, W: 16, H: 3.2, holeD: 3.1, holeDepth: 2, bossD: 4, bossH: 2, spacingX: 7, spacingY: 7 };

const sel = new Set([1, 2, 3, 4, 5, 6]);   // 已选点位，唯一状态源
let model = null;
let cam = { yaw: -0.62, elev: 0.72, zoom: 1 };
let drag = null;

function readParams(){
  const p = {};
  for (const k of IDS) {
    const v = parseFloat($('p-' + k).value);
    p[k] = Number.isFinite(v) && v > 0 ? v : DEF[k];
  }
  p.dome = $('p-dome').checked;
  return p;
}

function fitCanvas(c){
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(c.clientWidth * dpr);
  c.height = Math.round(c.clientHeight * dpr);
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

/* ---------- 3D ---------- */
function draw3D(){
  const c = $('view'), ctx = fitCanvas(c);
  const W = c.clientWidth, Hpx = c.clientHeight;
  ctx.clearRect(0, 0, W, Hpx);
  if (!model) return;

  const A = cam.yaw, E = cam.elev;
  const cA = Math.cos(A), sA = Math.sin(A), cE = Math.cos(E), sE = Math.sin(E);
  const cx = model.L / 2, cy = model.W / 2, cz = model.totalH / 2;

  const view = [];
  for (const t of model.tris) {
    const v = new Array(9);
    for (let i = 0; i < 9; i += 3) {
      const x = t[i] - cx, y = t[i + 1] - cy, z = t[i + 2] - cz;
      const qx = x * cA - y * sA, qy = x * sA + y * cA;
      v[i] = qx;
      v[i + 1] = qy * sE - z * cE;
      v[i + 2] = z * cE + qy * sE;
    }
    view.push(v);
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const v of view) for (let i = 0; i < 9; i += 3) {
    if (v[i] < minX) minX = v[i]; if (v[i] > maxX) maxX = v[i];
    if (v[i + 1] < minY) minY = v[i + 1]; if (v[i + 1] > maxY) maxY = v[i + 1];
  }
  const spanX = Math.max(maxX - minX, 1e-3), spanY = Math.max(maxY - minY, 1e-3);
  const s = Math.min(W * 0.84 / spanX, Hpx * 0.84 / spanY) * cam.zoom;
  const ox = W / 2 - (minX + maxX) / 2 * s, oy = Hpx / 2 - (minY + maxY) / 2 * s;

  const Ld = [-0.35, -0.45, 0.82], Ll = Math.hypot(...Ld);
  const order = view.map((v, i) => i).sort((a, b) =>
    (view[a][2] + view[a][5] + view[a][8]) - (view[b][2] + view[b][5] + view[b][8]));

  for (const idx of order) {
    const v = view[idx];
    const ux = v[3] - v[0], uy = v[4] - v[1], uz = v[5] - v[2];
    const vx = v[6] - v[0], vy = v[7] - v[1], vz = v[8] - v[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const nl = Math.hypot(nx, ny, nz) || 1;
    nx /= nl; ny /= nl; nz /= nl;
    if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
    const lam = Math.max(0, (nx * Ld[0] + ny * Ld[1] + nz * Ld[2]) / Ll);
    const k = 0.36 + 0.64 * Math.pow(lam, 0.85);
    ctx.fillStyle = 'rgb(' + Math.round(118 * k) + ',' + Math.round(132 * k) + ',' + Math.round(166 * k) + ')';
    ctx.beginPath();
    ctx.moveTo(ox + v[0] * s, oy + v[1] * s);
    ctx.lineTo(ox + v[3] * s, oy + v[4] * s);
    ctx.lineTo(ox + v[6] * s, oy + v[7] * s);
    ctx.closePath();
    ctx.fill();
  }
}

/* ---------- 俯视图 ---------- */
function draw2D(){
  const c = $('plan'), ctx = fitCanvas(c);
  const W = c.clientWidth, H = c.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!model) return;

  const m = model, padL = 62, padR = 34, padT = 34, padB = 54;
  const s = Math.min((W - padL - padR) / m.L, (H - padT - padB) / m.W);
  const ox = padL + (W - padL - padR - m.L * s) / 2;
  const oy = padT + (H - padT - padB - m.W * s) / 2;
  const X = x => ox + x * s;
  const Y = y => oy + (m.W - y) * s;

  // 板体
  ctx.fillStyle = '#eef1f8';
  ctx.strokeStyle = '#8d99b3';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.rect(X(0), Y(m.W), m.L * s, m.W * s);
  ctx.fill();
  ctx.stroke();

  // 六个点位：选中 = 凸起，未选 = 虚线空位
  for (const o of m.pos) {
    const px = X(o.x), py = Y(o.y), R = (m.bossD / 2) * s;
    const on = m.chosen.some(c => c.d === o.d);
    if (on) {
      ctx.save();
      ctx.shadowColor = 'rgba(40,60,140,.35)';
      ctx.shadowBlur = 7;
      ctx.shadowOffsetY = 2;
      const g = ctx.createRadialGradient(px - R * 0.36, py - R * 0.4, R * 0.08, px, py, R * 1.05);
      g.addColorStop(0, '#9db1f7');
      g.addColorStop(0.65, '#4a68dd');
      g.addColorStop(1, '#2a45b4');
      ctx.beginPath();
      ctx.arc(px, py, R, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(px, py, R, 0, Math.PI * 2);
      ctx.strokeStyle = '#24409e';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.save();
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(px, py, R, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.fill();
      ctx.strokeStyle = '#c3cadb';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = on ? '#ffffff' : '#a9b1c6';
    ctx.font = 'bold 11px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(o.d), px, py + 0.5);
  }

  // 隐藏的磁铁孔
  ctx.save();
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = '#d64545';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(X(m.L / 2), Y(m.W / 2), m.r * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 中心线
  ctx.save();
  ctx.setLineDash([9, 3, 2, 3]);
  ctx.strokeStyle = 'rgba(214,69,69,.45)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(X(m.L / 2), Y(m.W + 2)); ctx.lineTo(X(m.L / 2), Y(-2));
  ctx.moveTo(X(-2), Y(m.W / 2)); ctx.lineTo(X(m.L + 2), Y(m.W / 2));
  ctx.stroke();
  ctx.restore();

  // 尺寸标注
  ctx.fillStyle = '#4a5470';
  ctx.font = '12px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const dim = (x1, y1, x2, y2, text, off) => {
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const a = [x1 + nx * off, y1 + ny * off], b = [x2 + nx * off, y2 + ny * off];
    ctx.strokeStyle = '#9aa5bd';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    for (const p of [a, b]) {
      ctx.moveTo(p[0] - nx * 3 - dx / len * 3, p[1] - ny * 3 - dy / len * 3);
      ctx.lineTo(p[0] + nx * 3 + dx / len * 3, p[1] + ny * 3 + dy / len * 3);
    }
    ctx.stroke();
    ctx.fillStyle = '#4a5470';
    ctx.fillText(text, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 8);
  };
  dim(X(0), Y(0), X(m.L), Y(0), m.L.toFixed(1), 20);          // 长
  dim(X(0), Y(0), X(0), Y(m.W), m.W.toFixed(1), -20);          // 宽

  // 点距标注（1→2 横向，1→4 纵向）
  const p1 = m.pos.find(o => o.d === 1), p2m = m.pos.find(o => o.d === 2), p4 = m.pos.find(o => o.d === 4);
  dim(X(p1.x), Y(p1.y), X(p2m.x), Y(p2m.y), m.spacingX.toFixed(1), -24);
  dim(X(p1.x), Y(p1.y), X(p4.x), Y(p4.y), m.spacingY.toFixed(1), 28);

  // 文字说明
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7a839a';
  ctx.font = '11.5px "Microsoft YaHei", sans-serif';
  ctx.fillText('磁铁孔 Ø' + (m.r * 2).toFixed(2) + ' × 深 ' + m.depth.toFixed(1) + '（与底面垂直、同心）',
    X(0), Y(-3.5) + 16);
}

/* ---------- 点位选择 ---------- */
function renderDots(){
  const box = $('dots');
  box.innerHTML = '';
  for (let d = 1; d <= 6; d++) {
    const on = sel.has(d);
    const b = document.createElement('button');
    b.className = 'dot' + (on ? ' on' : '');
    b.innerHTML = '<i></i><span>' + d + '</span>';
    b.title = '点位 ' + d + (on ? '（点击取消）' : '（点击选中）');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', () => {
      if (sel.has(d)) sel.delete(d); else sel.add(d);
      renderDots();      // 按钮状态即时回显
      rebuild();         // 模型/俯视图即时重建
    });
    box.appendChild(b);
  }
  const list = [...sel].sort((a, b) => a - b);
  $('dotstr').textContent = list.length ? list.join('') : '无';
  $('braille').textContent = brailleChar(list);
  $('bosscount').textContent = list.length;
  syncPresets();
}

/* ---------- 盲文预设 ---------- */
const PRESETS = [
  { g: '声母', items: [
    ['b', '12'], ['p', '1234'], ['m', '134'], ['f', '124'], ['d', '145'], ['t', '2345'],
    ['n', '1345'], ['l', '123'], ['g / j', '1245'], ['k / q', '13'], ['h / x', '125'],
    ['zh', '34'], ['ch', '12345'], ['sh', '156'], ['r', '245'], ['z', '1356'], ['c', '14'], ['s', '234']
  ]},
  { g: '韵母', items: [
    ['a', '35'], ['o / e', '26'], ['i', '24'], ['u', '136'], ['ü', '346'], ['eng', '3456'], ['in', '126']
  ]},
  { g: '声调', items: [
    ['ˉ 一声', '1'], ['ˊ 二声', '2'], ['ˇ 三声', '3'], ['ˋ 四声', '23']
  ]},
  { g: '数字（前置数号 ⠼）', items: [
    ['1', '12'], ['2', '14'], ['3', '145'], ['4', '15'], ['5', '124'],
    ['6', '1245'], ['7', '125'], ['8', '24'], ['9', '245'], ['0', '35']
  ]}
];
const keyOf = list => [...list].sort((a, b) => a - b).join('');

function renderPresets(){
  const box = $('presets');
  box.innerHTML = '';
  for (const grp of PRESETS) {
    const t = document.createElement('div');
    t.className = 'pgname';
    t.textContent = grp.g;
    box.appendChild(t);
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    for (const [label, ds] of grp.items) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.dataset.dots = ds;
      b.innerHTML = '<em>' + brailleChar(ds.split('').map(Number)) + '</em><span>' + label + '</span>';
      b.title = label + ' = 点位 ' + ds;
      b.addEventListener('click', () => {
        const already = keyOf(sel) === ds;
        sel.clear();
        if (!already) for (const c of ds) sel.add(Number(c));
        renderDots();
        rebuild();
      });
      wrap.appendChild(b);
    }
    box.appendChild(wrap);
  }
  syncPresets();
}

function syncPresets(){
  const k = keyOf(sel);
  document.querySelectorAll('#presets .chip').forEach(b => {
    b.classList.toggle('on', b.dataset.dots === k);
  });
}

function rebuild(){
  const p = readParams();
  const list = [...sel].sort((a, b) => a - b);
  model = buildModel(p, list);
  draw3D();
  draw2D();
  const m = model;
  $('meta').innerHTML =
    '外形 <b>' + m.L.toFixed(1) + ' × ' + m.W.toFixed(1) + ' × ' + m.totalH.toFixed(1) + '</b> mm' +
    '（本体 ' + m.H.toFixed(1) + ' + 凸台 ' + (m.totalH - m.H).toFixed(1) + '）<br>' +
    '点位 <b>' + (list.length ? list.join(' ') : '无') + '</b> ' + brailleChar(list) +
    ' · 凸台 <b>' + m.chosen.length + '</b> 个 · 面数 <b>' + m.tris.length + '</b><br>' +
    '体积 <b>' + (m.vol / 1000).toFixed(2) + '</b> cm³ · PLA 约 <b>' + (m.vol * 1.24 / 1000).toFixed(1) + '</b> g';
  $('warn').innerHTML = (m.warn.length ? [...new Set(m.warn)] : []).map(w => '<div>' + w + '</div>').join('');
}

/* ---------- 交互 ---------- */
const view = $('view');
view.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, elev: cam.elev };
  view.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.yaw = drag.yaw + (e.clientX - drag.x) * 0.008;
  cam.elev = Math.max(0.12, Math.min(1.5, drag.elev - (e.clientY - drag.y) * 0.006));
  draw3D();
});
view.addEventListener('pointerup', () => { drag = null; });
view.addEventListener('pointercancel', () => { drag = null; });
view.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = Math.max(0.4, Math.min(3.2, cam.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
  draw3D();
}, { passive: false });

IDS.forEach(k => $('p-' + k).addEventListener('input', rebuild));
$('p-dome').addEventListener('change', rebuild);

$('selAll').addEventListener('click', () => {
  [1, 2, 3, 4, 5, 6].forEach(d => sel.add(d));
  renderDots();
  rebuild();
});
$('selNone').addEventListener('click', () => {
  sel.clear();
  renderDots();
  rebuild();
});

$('reset').addEventListener('click', () => {
  IDS.forEach(k => { $('p-' + k).value = DEF[k]; });
  $('p-dome').checked = false;
  cam = { yaw: -0.62, elev: 0.72, zoom: 1 };
  sel.clear();
  [1, 2, 3, 4, 5, 6].forEach(d => sel.add(d));
  renderDots();
  rebuild();
});

$('download').addEventListener('click', () => {
  if (!model) return;
  const buf = buildSTL(model.tris);
  const a = document.createElement('a');
  const pts = [...sel].sort((x, y) => x - y).join('') || '0';
  const name = '磁吸底板_' + model.L.toFixed(0) + 'x' + model.W.toFixed(0) + 'x' +
    model.H.toFixed(1) + '_' + pts + '.stl';
  a.href = URL.createObjectURL(new Blob([buf], { type: 'model/stl' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

window.addEventListener('resize', () => { draw3D(); draw2D(); });

renderPresets();
renderDots();
rebuild();
</script>
</body>
